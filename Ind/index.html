<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чат-платформа</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">Чат-платформа</a>
            <div class="navbar-nav">
                <a class="nav-link active" href="#" data-tab="top">Топ</a>
                <a class="nav-link" href="#" data-tab="chat">Чат</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <!-- Вкладка Топ -->
        <div id="top-tab" class="tab-content active">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>Популярные чаты</h2>
                <div class="btn-group">
                    <button class="btn btn-primary" id="createChatBtn">Создать чат</button>
                    <button class="btn btn-success" id="createCategoryBtn">Создать тему</button>
                </div>
            </div>
            <div id="chatsList" class="row">
                <!-- Здесь будут отображаться чаты -->
            </div>
        </div>

        <!-- Вкладка Чат -->
        <div id="chat-tab" class="tab-content">
            <div class="chat-container">
                <div class="chat-header">
                    <h3 id="currentChatName">Название чата</h3>
                    <div class="chat-info">
                        <span id="onlineCount">Онлайн: 0</span>
                    </div>
                </div>
                <div class="messages-container" id="messagesContainer">
                    <!-- Здесь будут сообщения -->
                </div>
                <div class="message-input">
                    <textarea id="messageInput" class="form-control" placeholder="Введите сообщение..."></textarea>
                    <button id="sendMessage" class="btn btn-primary">Отправить</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Модальное окно создания чата -->
    <div class="modal fade" id="createChatModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Создать новый чат</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="createChatForm">
                        <div class="mb-3">
                            <label for="chatName" class="form-label">Название чата</label>
                            <input type="text" class="form-control" id="chatName" required>
                        </div>
                        <div class="mb-3">
                            <label for="chatCategory" class="form-label">Категория</label>
                            <select class="form-select" id="chatCategory" required>
                                <!-- Категории будут загружены динамически -->
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                    <button type="button" class="btn btn-primary" id="submitCreateChat">Создать</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Модальное окно создания темы -->
    <div class="modal fade" id="createCategoryModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Создать новую тему</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="createCategoryForm">
                        <div class="mb-3">
                            <label for="categoryName" class="form-label">Название темы</label>
                            <input type="text" class="form-control" id="categoryName" required>
                        </div>
                        <div class="mb-3">
                            <label for="categoryDescription" class="form-label">Описание</label>
                            <textarea class="form-control" id="categoryDescription" rows="3" required></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                    <button type="button" class="btn btn-success" id="submitCreateCategory">Создать</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
    <script src="js/chat.js"></script>
    <script src="js/top.js"></script>
</body>
</html>
