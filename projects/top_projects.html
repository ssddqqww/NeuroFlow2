        function toggleProfile() {
          const modal = document.getElementById('profile-modal');
          const overlay = document.getElementById('profile-overlay');
          
          const nicknameInput = document.querySelector('.profile-nickname-input');
          if (nicknameInput) {
              const nicknameValue = nicknameInput.value.trim();
              if (!nicknameValue) {
                  return;
              }
              const newNicknameDiv = document.createElement('div');
              newNicknameDiv.textContent = nicknameValue;
              newNicknameDiv.className = 'profile-nickname';
              newNicknameDiv.id = 'profile-nickname';
              newNicknameDiv.onclick = editNickname;
              nicknameInput.replaceWith(newNicknameDiv);
          }
  
          modal.classList.toggle('active');
          overlay.classList.toggle('active');
      }
  
        function editNickname() {
          const nicknameDiv = document.getElementById('profile-nickname');
          const currentNickname = nicknameDiv.textContent;
  
          const input = document.createElement('input');
          input.type = 'text';
          input.value = currentNickname;
          input.className = 'profile-nickname-input';

input.maxLength = 18;
          
          nicknameDiv.replaceWith(input);
          input.focus();
  
          input.addEventListener('keypress', function(e) {
              if (e.key === 'Enter') {
                  const newNickname = input.value.trim();
                  if (newNickname) {
                      const newNicknameDiv = document.createElement('div');
                      newNicknameDiv.textContent = newNickname;
                      newNicknameDiv.className = 'profile-nickname';
                      newNicknameDiv.id = 'profile-nickname';
                      newNicknameDiv.onclick = editNickname;
                      input.replaceWith(newNicknameDiv);
                  }
              }
          });
          
      }
  
        function changeAvatar(event) {
          const file = event.target.files[0];
          if (file) {
              const reader = new FileReader();
              const avatar = document.getElementById('profile-avatar');
              
              reader.onload = function(e) {
                  avatar.src = e.target.result;
                  const avatar_main = document.querySelector('.profile-btn');
                  avatar_main.style.background = url(${e.target.result});
                  avatar_main.style.backgroundSize = '40px 40px';
              };
              reader.readAsDataURL(file);
          }
      }
  
        document.getElementById('profile-overlay').addEventListener('click', function() {
            toggleProfile();
        });
  
        document.getElementById('profile-modal').addEventListener('click', function(e) {
            e.stopPropagation();
        });
      </script>

async function checkAuth() {
  try {
    const response = await fetch(`${API_BASE_URL}/api/check-auth`, {
      credentials: 'include'
    });
    const data = await response.json();
    if (data.authenticated) {
      activeUser = data.user;
    } else {
      activeUser = null;
    }
    await loadProjects();
  } catch (error) {
    console.error('Error checking auth:', error);
    setStatus('Authentication check failed');
  }
}

  function setStatus(message, isError = true) {
    const statusDiv = document.getElementById('status');
    statusDiv.textContent = message;
    statusDiv.className = `bg-${isError ? 'red' : 'green'}-100 border border-${isError ? 'red' : 'green'}-400 text-${isError ? 'red' : 'green'}-700 px-4 py-3 rounded mb-4`;
    statusDiv.classList.remove('hidden');
    setTimeout(() => statusDiv.classList.add('hidden'), 3000);
  }

  function sanitizeInput(str) {
    if (!str) return '';
    const safeStr = String(str);
    return safeStr
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;')
      .replace(/`/g, '&#96;')
      .replace(/\(/g, '&#40;')
      .replace(/\)/g, '&#41;');
  }

  async function loadProjects() {
    try {
      const response = await fetch(`${API_BASE_URL}/api/projects`, {
        credentials: 'include'
      });
      if (!response.ok) throw new Error(`Failed to load projects: ${response.status}`);
      projects = await response.json();

      for (let project of projects) {
        try {
          const ratingsResponse = await fetch(`${API_BASE_URL}/api/projects/${project.id}/ratings`, {
            credentials: 'include'
          });
          if (ratingsResponse.ok) {
            const ratingsData = await ratingsResponse.json();
            project.ratings = Array.isArray(ratingsData.ratings) ? ratingsData.ratings : [];
            project.averageRating = ratingsData.average != null && !isNaN(ratingsData.average)
              ? parseFloat(ratingsData.average)
              : project.ratings.length
                ? project.ratings.reduce((sum, r) => sum + r.rating, 0) / project.ratings.length
                : 0;
            project.ratingCount = ratingsData.count != null && !isNaN(ratingsData.count)
              ? parseInt(ratingsData.count)
              : project.ratings.length;
          } else {
            project.ratings = Array.isArray(project.ratings) ? project.ratings : [];
            project.averageRating = project.ratings.length
              ? project.ratings.reduce((sum, r) => sum + r.rating, 0) / project.ratings.length
              : 0;
            project.ratingCount = project.ratings.length;
          }
        } catch (error) {
          console.error(`Error fetching ratings for project ${project.id}:`, error);
          project.ratings = Array.isArray(project.ratings) ? project.ratings : [];
          project.averageRating = project.ratings.length
            ? project.ratings.reduce((sum, r) => sum + r.rating, 0) / project.ratings.length
            : 0;
          project.ratingCount = project.ratings.length;
        }
      }

      const validProjects = projects.filter(p => p.ratingCount >= MIN_VOTES);
      const meanRating = validProjects.length
        ? validProjects.reduce((sum, p) => sum + parseFloat(p.averageRating), 0) / validProjects.length
        : 5.0;

      projects = projects.map(project => {
        const themeMap = {
          'ecology': 'Ecology',
          'education': 'Education',
          'medicine': 'Medicine',
          'community': 'Community Development',
          'technology': 'Information Technology',
          'culture': 'Cultural Heritage',
          'humanitarian': 'Humanitarian Aid'
        };
        const category = themeMap[project.theme.toLowerCase()] || project.theme || 'Other';
        let weightedRating = project.averageRating;
        if (project.ratingCount >= MIN_VOTES) {
          const v = project.ratingCount;
          const R = parseFloat(project.averageRating);
          const C = meanRating;
          const m = MIN_VOTES;
          weightedRating = (v / (v + m)) * R + (m / (v + m)) * C;
        } else {
          weightedRating = 0;
        }
        return {
          ...project,
          category,
          weightedRating: weightedRating.toFixed(2),
          image: project.image || 'https://via.placeholder.com/150'
        };
      });

      projects.sort((a, b) => parseFloat(b.weightedRating) - parseFloat(a.weightedRating));
      populateFilters();
      filterProjects();
    } catch (error) {
      console.error('Error loading projects:', error);
      setStatus('Failed to load projects');
    }
  }

  function filterProjects() {
    const selectedCountries = Array.from(document.querySelectorAll('#countryFilters .filter-item.selected'))
      .map(item => item.dataset.country);
    const selectedThemes = Array.from(document.querySelectorAll('#themeFilters .filter-item.selected'))
      .map(item => item.dataset.theme);
    const selectedEventTypes = Array.from(document.querySelectorAll('#eventTypeFilters .filter-item.selected'))
      .map(item => item.dataset.eventType);
    const searchQuery = document.getElementById('searchBar').value.trim().toLowerCase();

    let filteredProjects = projects.filter(project => {
      const matchesCountry = selectedCountries.length === 0 || selectedCountries.includes(project.country);
      const matchesTheme = selectedThemes.length === 0 || selectedThemes.includes(project.category);
      const matchesEventType = selectedEventTypes.length === 0 || selectedEventTypes.includes(project.eventType);
      const matchesSearch = searchQuery === '' ||
        project.title.toLowerCase().includes(searchQuery) ||
        project.description.toLowerCase().includes(searchQuery);
      return matchesCountry && matchesTheme && matchesEventType && matchesSearch && parseFloat(project.weightedRating) > 0;
    });

    updateProjectList(filteredProjects);
  }

    document.querySelectorAll('.details-btn').forEach(btn => btn.onclick = () => {

  // Create modal container
  const modal = document.createElement('div');
  modal.className = 'app-modal';

  // Create iframe
  const iframe = document.createElement('iframe');
  iframe.className = 'app-iframe';
  iframe.src = `../aplication/projects/${name}/index.html`;

  // Create close button
  const closeButton = document.createElement('button');
  closeButton.className = 'app-close-btn';
  closeButton.innerHTML = '✕';
  closeButton.onclick = () => {
    modal.remove();
    overlay.remove();
    // No need to restore .container, as it was never hidden
  };

  // Append elements
  modal.appendChild(iframe);
  modal.appendChild(closeButton);
  document.body.appendChild(overlay);
  document.body.appendChild(modal);

  // Handle iframe load errors
  iframe.onerror = () => {
    setStatus('Failed to load the project application.');
    modal.remove();
    overlay.remove();
  };
}
  function closeContactModal() {
    document.getElementById('contactModal').classList.add('hidden');
    document.getElementById('contactIframe').src = '';
  }

  function toggleChat() {
    const chatWindow = document.getElementById('chatWindow');
    chatWindow.classList.toggle('active');
  }

  function sendMessage_nopobleminfuture() {
    const messageInput = document.getElementById('messageInputUN');
    const messageText = messageInput.value.trim();

      const chatMessages = document.getElementById('chatMessages');

  function toggleProfile() {
    const modal = document.getElementById('profile-modal');
    const overlay = document.getElementById('profile-overlay');
    
    const nicknameInput = document.querySelector('.profile-nickname-input');
    if (nicknameInput) {
      const nicknameValue = nicknameInput.value.trim();
      if (!nicknameValue) {
        return;
      }
      const newNicknameDiv = document.createElement('div');
      newNicknameDiv.textContent = nicknameValue;
      newNicknameDiv.className = 'pfc-profile-nickname';
      newNicknameDiv.id = 'profile-nickname';
      newNicknameDiv.onclick = editNickname;
      nicknameInput.replaceWith(newNicknameDiv);
    }

    modal.classList.toggle('pfc-active');
    overlay.classList.toggle('pfc-active');
  }

  function editNickname() {
    const nicknameDiv = document.getElementById('profile-nickname');
    const currentNickname = nicknameDiv.textContent;

    const input = document.createElement('input');
    input.type = 'text';
    input.value = currentNickname;
    input.className = 'profile-nickname-input';
    input.maxLength = 18;
    
    nicknameDiv.replaceWith(input);
    input.focus();

    input.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        const newNickname = input.value.trim();
        if (newNickname) {
          const newNicknameDiv = document.createElement('div');
          newNicknameDiv.textContent = newNickname;
          newNicknameDiv.className = 'pfc-profile-nickname';
          newNicknameDiv.id = 'profile-nickname';
          newNicknameDiv.onclick = editNickname;
          input.replaceWith(newNicknameDiv);
        }
      }
    });
  }

  function changeAvatar(event) {
    const file = event.target.files[0];
    if (file) {
      const reader = new FileReader();
      const avatar = document.getElementById('profile-avatar');
      
      reader.onload = function(e) {
        avatar.src = e.target.result;
        const avatar_main = document.querySelector('.pfc-profile-btn');
        avatar_main.style.background = `url(${e.target.result}) no-repeat center`;
        avatar_main.style.backgroundSize = 'cover';
      };
      reader.readAsDataURL(file);
    }
  }

  function handleClick(element) {
    element.classList.toggle('active');
    setTimeout(() => {
      window.location.href = '../login/login.html';
    }, 5000);
  }

  document.addEventListener('DOMContentLoaded', () => {
    loadProjects();
    checkAuth();
    const searchInput = document.getElementById('searchBar');
    searchInput.addEventListener('input', debounce(() => {
      filterProjects();
    }, 300));

    const clearFiltersBtn = document.getElementById('clearFilters');
    clearFiltersBtn.addEventListener('click', () => {
      document.querySelectorAll('.filter-item.selected').forEach(item => {
        item.classList.remove('selected');
      });
      searchInput.value = '';
      filterProjects();
    });

    document.getElementById('closeJoinModal').onclick = closeJoinProjectModal;
    document.getElementById('closeContactModal').onclick = closeContactModal;
  });

  function debounce(func, wait) {
    let timeout;
    return function executedFunction(...args) {
      const later = () => {
        clearTimeout(timeout);
        func(...args);
      };
      clearTimeout(timeout);
      timeout = setTimeout(later, wait);
    };
  }
