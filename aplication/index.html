      <script>
        function toggleProfile() {
          const modal = document.getElementById('profile-modal');
          const overlay = document.getElementById('profile-overlay');
          
          const nicknameInput = document.querySelector('.profile-nickname-input');
          if (nicknameInput) {
              const nicknameValue = nicknameInput.value.trim();
              if (!nicknameValue) {
                  return;
              }
              const newNicknameDiv = document.createElement('div');
              newNicknameDiv.textContent = nicknameValue;
              newNicknameDiv.className = 'profile-nickname';
              newNicknameDiv.id = 'profile-nickname';
              newNicknameDiv.onclick = editNickname;
              nicknameInput.replaceWith(newNicknameDiv);
          }
  
          modal.classList.toggle('active');
          overlay.classList.toggle('active');
      }
  
        function editNickname() {
          const nicknameDiv = document.getElementById('profile-nickname');
          const currentNickname = nicknameDiv.textContent;
  
          const input = document.createElement('input');
          input.type = 'text';
          input.value = currentNickname;
          input.className = 'profile-nickname-input';
          input.maxLength = 18;
          
          nicknameDiv.replaceWith(input);
          input.focus();
  
          input.addEventListener('keypress', function(e) {
              if (e.key === 'Enter') {
                  const newNickname = input.value.trim();
                  if (newNickname) {
                      const newNicknameDiv = document.createElement('div');
                      newNicknameDiv.textContent = newNickname;
                      newNicknameDiv.className = 'profile-nickname';
                      newNicknameDiv.id = 'profile-nickname';
                      newNicknameDiv.onclick = editNickname;
                      input.replaceWith(newNicknameDiv);
                  }
              }
          });
          
      }
  
        function changeAvatar(event) {
          const file = event.target.files[0];
          if (file) {
              const reader = new FileReader();
              const avatar = document.getElementById('profile-avatar');
              
              reader.onload = function(e) {
                  avatar.src = e.target.result;
                  const avatar_main = document.querySelector('.profile-btn');
                  avatar_main.style.background = `url(${e.target.result})`;
                  avatar_main.style.backgroundSize = '40px 40px';
              };
              reader.readAsDataURL(file);
          }
      }
  
        document.getElementById('profile-overlay').addEventListener('click', function() {
            toggleProfile();
        });
  
        document.getElementById('profile-modal').addEventListener('click', function(e) {
            e.stopPropagation();
        });
      </script>

    <script>
        let apps = [];
        let userActions = {
            likes: {},
            dislikes: {},
            reviews: {},
            review_likes: {},
            review_dislikes: {},
            replies: {},
            show_reviews: {}
        };

        async function fetchUserActions() {
            try {
                // Всегда сначала загружаем с сервера
                const response = await fetch('/aplication/user-actions');
                if (!response.ok) throw new Error('Error loading user actions');
                const data = await response.json();
                userActions = {
                    likes: data.likes || {},
                    dislikes: data.dislikes || {},
                    reviews: data.reviews || {},
                    review_likes: data.review_likes || {},
                    review_dislikes: data.review_dislikes || {},
                    replies: data.replies || {},
                    show_reviews: data.show_reviews || {}
                };
                
                // После загрузки с сервера обновляем localStorage
                localStorage.setItem('userActions', JSON.stringify(userActions));
            } catch (error) {
                console.error('Ошибка загрузки действий пользователя:', error);
                // В случае ошибки используем значения по умолчанию
                userActions = {
                    likes: {},
                    dislikes: {},
                    reviews: {},
                    review_likes: {},
                    review_dislikes: {},
                    replies: {},
                    show_reviews: {}
                };
                // В случае ошибки тоже сохраняем в localStorage
                localStorage.setItem('userActions', JSON.stringify(userActions));
            }
        }

        // Функция для сохранения действий в localStorage
        function saveToLocalStorage() {
            localStorage.setItem('userActions', JSON.stringify(userActions));
        }

        // Функция для сохранения данных на сервер
        async function saveToServer() {
            try {
                const response = await fetch('/aplication/user-actions', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'X-Requested-With': 'XMLHttpRequest' // Добавляем заголовок для AJAX запроса
                    },
                    body: JSON.stringify(userActions)
                });

                if (!response.ok) throw new Error('Error saving to server');
                console.log('Данные успешно сохранены на сервер');
            } catch (error) {
                console.error('Ошибка сохранения на сервер:', error);
                throw error;
            }
        }

        async function toggleLike(appId, event) {
            if (event) {
                event.preventDefault();
                event.stopPropagation();
            }
            try {
                const app = apps.find(a => a.id === appId);
                if (!app) return;

                const userLiked = userActions.likes[appId] || false;
                const userDisliked = userActions.dislikes[appId] || false;

                // Сначала снимаем дизлайк если он есть
                if (userDisliked) {
                    app.dislikes--;
                    userActions.dislikes[appId] = false;
                }

                // Затем обрабатываем лайк
                if (userLiked) {
                    app.likes--;
                    userActions.likes[appId] = false;
                } else {
                    app.likes++;
                    userActions.likes[appId] = true;
                }

                // Обновляем UI
                const likeSpan = document.querySelector(`.like-btn[data-app-id="${appId}"]`);
                const dislikeSpan = document.querySelector(`.dislike-btn[data-app-id="${appId}"]`);
                
                if (likeSpan) {
                    likeSpan.textContent = `👍 ${app.likes}`;
                    likeSpan.className = `like-btn ${userActions.likes[appId] ? 'active' : ''}`;
                }
                if (dislikeSpan) {
                    dislikeSpan.textContent = `👎 ${app.dislikes}`;
                    dislikeSpan.className = `dislike-btn ${userActions.dislikes[appId] ? 'active' : ''}`;
                }

                // Отмечаем, что есть несохраненные изменения
                hasUnsavedChanges = true;
                //showNotification('Лайк поставлен');
            } catch (error) {
                console.error('Ошибка при сохранении:', error);
                showNotification('Ошибка при сохранении: ' + error.message);
            }
        }

        async function addApp() {
            const name = document.getElementById('new-app-name').value.trim();
            const category = document.getElementById('new-app-category').value;
            if (name && category) {
                await fetchApps();
                if (apps.some(app => app.name.toLowerCase() === name.toLowerCase())) {
                    alert('An application with this name already exists!');
                    return;
                }
                const newAppId = apps.length + 1;
                const newApp = {
                    id: newAppId,
                    name,
                    category,
                    likes: 0,
                    dislikes: 0,
                    reviews: []
                };
                apps.push(newApp);
                
                // Инициализируем все необходимые поля в userActions
                if (!userActions.likes) userActions.likes = {};
                if (!userActions.dislikes) userActions.dislikes = {};
                if (!userActions.reviews) userActions.reviews = {};
                if (!userActions.show_reviews) userActions.show_reviews = {};
                
                userActions.likes[newAppId] = false;
                userActions.dislikes[newAppId] = false;
                userActions.reviews[newAppId] = false;
                userActions.show_reviews[newAppId] = false;
                
                await Promise.all([
                    saveApps(),
                    saveToLocalStorage()
                ]);
                
                await fetchUserActions(); // Обновляем действия пользователя
                renderApps();
                closeAppCreation();
                //showNotification('Приложение создано!');
            }
        }

        async function addCategory() {
            const name = document.getElementById('new-category-name').value.trim();
            const isPublic = document.getElementById('public-category').checked;
            if (name && isPublic) {
                try {
                    // Сначала проверяем, существует ли категория
                    const categories = await fetchCategories();
                    if (categories.includes(name)) {
                        alert('A category with this name already exists!');
                        return;
                    }

                    // Отправляем категорию на сервер
                    const response = await fetch('/aplication/categories', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name: name })
                    });

                    if (!response.ok) {
                        throw new Error('Ошибка при сохранении категории');
                    }

                    const result = await response.json();
                    if (!result.success) {
                        throw new Error(result.error || 'Ошибка при сохранении категории');
                    }

                    // Обновляем UI
                    await renderCategories();
                    closeCategoryModal();
                    showNotification('Категория успешно создана!');
                } catch (error) {
                    console.error('Ошибка при создании категории:', error);
                    showNotification('Ошибка при создании категории: ' + error.message);
                }
            }
        }

        function showPublishForm() {
            document.getElementById('projectName').value = '';
            document.getElementById('publish-modal').style.display = 'flex';
            renderCategories();
        }

        function cancelPublish() {
            document.getElementById('publish-modal').style.display = 'none';
        }

        async function publishProject() {
            document.getElementById('header').classList.remove('hidden_all_h');
            const name = document.getElementById('projectName').value.trim();
            const category = document.getElementById('projectCategory').value;
            if (name && category) {
                const htmlCode = document.getElementById('htmlCode').value;
                const cssCode = document.getElementById('cssCode').value;
                const jsCode = document.getElementById('jsCode').value;

                const projectData = {
                    name: name,
                    category: category,
                    html: htmlCode,
                    css: cssCode,
                    js: jsCode
                };

                try {
                    const response = await fetch('/aplication/save-project', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(projectData)
                    });

                    if (!response.ok) {
                        throw new Error('Ошибка при сохранении проекта');
                    }

                    await fetchApps();
                    if (apps.some(app => app.name.toLowerCase() === name.toLowerCase())) {
                        alert('An application with this name already exists!');
                        return;
                    }
                    apps.push({
                        id: apps.length + 1,
                        name,
                        category,
                        likes: 0,
                        dislikes: 0,
                        reviews: []
                    });
                    await saveApps();
                    renderApps();

                    document.getElementById('publish-modal').style.display = 'none';
                    document.querySelector('.test_all').classList.add('hidden_all_h');
                    document.querySelector('.search-bar').classList.remove('hidden_all_h');
                    document.querySelector('.filter').classList.remove('hidden_all_h');
                    document.getElementById('app-list').classList.remove('hidden_all_h');
                    document.getElementById('app-creation').classList.remove('hidden_all_h');
                    //showNotification('Проект успешно опубликован!');
                } catch (error) {
                    showNotification('Ошибка при сохранении проекта: ' + error.message);
                }
            } else {
                alert('Please fill in all fields!');
            }
        }

        document.querySelectorAll('.modal').forEach(modal => {
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    e.preventDefault();
                    modal.style.display = 'none';
                }
            });
        });

        document.getElementById('search').addEventListener('input', (e) => {
            e.preventDefault();
            renderApps();
        });

        document.getElementById('category-filter').addEventListener('change', (e) => {
            e.preventDefault();
            renderApps();
        });

        // Добавляем обработчики для кнопок в модальных окнах
        document.querySelector('button[onclick="openCategoryModal()"]').addEventListener('click', (e) => {
            e.preventDefault();
            openCategoryModal();
        });

        document.querySelector('button[onclick="openAppCreation()"]').addEventListener('click', (e) => {
            e.preventDefault();
            openAppCreation();
        });

        document.querySelector('button[onclick="addApp()"]').addEventListener('click', (e) => {
            e.preventDefault();
            addApp();
        });

        document.querySelector('button[onclick="closeAppCreation()"]').addEventListener('click', (e) => {
            e.preventDefault();
            closeAppCreation();
        });

        document.querySelector('button[onclick="addCategory()"]').addEventListener('click', (e) => {
            e.preventDefault();
            addCategory();
        });

        document.querySelector('button[onclick="closeCategoryModal()"]').addEventListener('click', (e) => {
            e.preventDefault();
            closeCategoryModal();
        });

        document.querySelector('button[onclick="publishProject()"]').addEventListener('click', (e) => {
            e.preventDefault();
            publishProject();
        });

        document.querySelector('button[onclick="cancelPublish()"]').addEventListener('click', (e) => {
            e.preventDefault();
            cancelPublish();
        });

        document.getElementById('testBtn').addEventListener('click', (e) => {
            e.preventDefault();
            runCode();
        });

        document.getElementById('publishBtn').addEventListener('click', (e) => {
            e.preventDefault();
            showPublishForm();
        });

        document.querySelector('.close-btn').addEventListener('click', (e) => {
            e.preventDefault();
            showMainView();
        });

        // Функция для инициализации при загрузке страницы
        async function initializeApp() {
            await fetchUserActions(); // Загружаем данные с сервера и обновляем localStorage
            await renderCategories();
            await renderApps();
        }

        // Запускаем инициализацию при загрузке страницы
        initializeApp();

        // Добавляем обработчики событий для форм
        document.querySelectorAll('form').forEach(form => {
            form.addEventListener('submit', (e) => {
                e.preventDefault();
            });
        });

        // Модифицируем обработчики событий для кнопок
        document.querySelectorAll('button').forEach(button => {
            if (!button.hasAttribute('onclick')) {
                button.addEventListener('click', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                });
            }
        });
    </script>
