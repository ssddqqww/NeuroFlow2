<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Waste Footprint Calculator</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
  <div class="bg-white p-6 rounded-lg shadow-lg w-full max-w-lg">
    <h1 class="text-2xl font-bold mb-4 text-center">Waste Footprint Calculator</h1>
    <form id="wasteForm" class="space-y-4">
      <div>
        <label for="bottles" class="block text-sm font-medium text-gray-700">Plastic Bottles (pcs/week)</label>
        <input type="number" id="bottles" min="0" class="mt-1 p-2 w-full border rounded-md" placeholder="0">
      </div>
      <div>
        <label for="coffeeCups" class="block text-sm font-medium text-gray-700">Coffee Cups (pcs/week)</label>
        <input type="number" id="coffeeCups" min="0" class="mt-1 p-2 w-full border rounded-md" placeholder="0">
      </div>
      <div>
        <label for="bags" class="block text-sm font-medium text-gray-700">Plastic Bags (pcs/week)</label>
        <input type="number" id="bags" min="0" class="mt-1 p-2 w-full border rounded-md" placeholder="0">
      </div>
      <div>
        <label for="foodContainers" class="block text-sm font-medium text-gray-700">Food Packaging (pcs/week)</label>
        <input type="number" id="foodContainers" min="0" class="mt-1 p-2 w-full border rounded-md" placeholder="0">
      </div>
      <div>
        <label for="utensils" class="block text-sm font-medium text-gray-700">Disposable Utensils/Straws (pcs/week)</label>
        <input type="number" id="utensils" min="0" class="mt-1 p-2 w-full border rounded-md" placeholder="0">
      </div>
      <div>
        <label for="officePaper" class="block text-sm font-medium text-gray-700">Office Paper (A4 sheets, pcs/week)</label>
        <input type="number" id="officePaper" min="0" class="mt-1 p-2 w-full border rounded-md" placeholder="0">
      </div>
      <div>
        <label for="magazines" class="block text-sm font-medium text-gray-700">Newspapers/Magazines (pcs/week)</label>
        <input type="number" id="magazines" min="0" class="mt-1 p-2 w-full border rounded-md" placeholder="0">
      </div>
      <div>
        <label for="cardboard" class="block text-sm font-medium text-gray-700">Cardboard/Boxes (pcs/week)</label>
        <input type="number" id="cardboard" min="0" class="mt-1 p-2 w-full border rounded-md" placeholder="0">
      </div>
      <div>
        <label for="glassBottles" class="block text-sm font-medium text-gray-700">Glass Bottles (pcs/week)</label>
        <input type="number" id="glassBottles" min="0" class="mt-1 p-2 w-full border rounded-md" placeholder="0">
      </div>
      <div>
        <label for="metalCans" class="block text-sm font-medium text-gray-700">Metal Cans (pcs/week)</label>
        <input type="number" id="metalCans" min="0" class="mt-1 p-2 w-full border rounded-md" placeholder="0">
      </div>
      <button type="submit" class="w-full bg-green-500 text-white p-2 rounded-md hover:bg-green-600">Calculate</button>
    </form>
    <div id="result" class="mt-4"></div>
    <canvas id="wasteChart" class="mt-4"></canvas>
  </div>

  <script>
    const wasteForm = document.getElementById('wasteForm');
    const resultDiv = document.getElementById('result');
    let wasteChart;

    wasteForm.addEventListener('submit', function(e) {
      e.preventDefault();

      const bottles = parseInt(document.getElementById('bottles').value) || 0;
      const coffeeCups = parseInt(document.getElementById('coffeeCups').value) || 0;
      const bags = parseInt(document.getElementById('bags').value) || 0;
      const foodContainers = parseInt(document.getElementById('foodContainers').value) || 0;
      const utensils = parseInt(document.getElementById('utensils').value) || 0;
      const officePaper = parseInt(document.getElementById('officePaper').value) || 0;
      const magazines = parseInt(document.getElementById('magazines').value) || 0;
      const cardboard = parseInt(document.getElementById('cardboard').value) || 0;
      const glassBottles = parseInt(document.getElementById('glassBottles').value) || 0;
      const metalCans = parseInt(document.getElementById('metalCans').value) || 0;

      const weights = {
        bottles: 10, // 0.5L plastic bottle ≈ 10g
        coffeeCups: 15, // cup with lid ≈ 15g
        bags: 5, // bag ≈ 5g
        foodContainers: 20, // container ≈ 20g
        utensils: 3, // fork/straw ≈ 3g
        officePaper: 5, // A4 sheet ≈ 5g
        magazines: 50, // newspaper/magazine ≈ 50g
        cardboard: 200, // box ≈ 200g
        glassBottles: 200, // 0.5L glass bottle ≈ 200g
        metalCans: 15 // aluminum can ≈ 15g
      };

      const prices = {
        plastic: 5, // $5/kg
        officePaper: 3, // $3/kg
        magazines: 3, // $3/kg
        cardboard: 2.5, // $2.5/kg
        glass: 1, // $1/kg
        metal: 30 // $30/kg
      };

      const plasticWeight =
        bottles * weights.bottles +
        coffeeCups * weights.coffeeCups +
        bags * weights.bags +
        foodContainers * weights.foodContainers +
        utensils * weights.utensils;
      const paperWeight =
        officePaper * weights.officePaper +
        magazines * weights.magazines +
        cardboard * weights.cardboard;
      const glassWeight = glassBottles * weights.glassBottles;
      const metalWeight = metalCans * weights.metalCans;
      const totalWeight = plasticWeight + paperWeight + glassWeight + metalWeight;

      const paperDetails = {
        officePaper: officePaper * weights.officePaper,
        magazines: magazines * weights.magazines,
        cardboard: cardboard * weights.cardboard
      };

      const earnings =
        (plasticWeight / 1000) * prices.plastic +
        (paperDetails.officePaper / 1000) * prices.officePaper +
        (paperDetails.magazines / 1000) * prices.magazines +
        (paperDetails.cardboard / 1000) * prices.cardboard +
        (glassWeight / 1000) * prices.glass +
        (metalWeight / 1000) * prices.metal;

      let tips = [];
      if (bottles > 5) tips.push('Use a reusable water bottle.');
      if (coffeeCups > 3) tips.push('Invest in a reusable thermos.');
      if (bags > 5) tips.push('Bring a cloth bag for shopping.');
      if (foodContainers > 3) tips.push('Buy bulk products using your own containers.');
      if (utensils > 5) tips.push('Carry reusable utensils.');
      if (officePaper > 50) tips.push('Switch to digital documents or recycle paper.');
      if (magazines > 5) tips.push('Recycle newspapers and magazines.');
      if (cardboard > 3) tips.push('Recycle clean cardboard separately, avoid contamination.');
      if (glassBottles > 5) tips.push('Return glass bottles to collection points.');
      if (metalCans > 5) tips.push('Recycle aluminum cans, they have high value.');

      resultDiv.innerHTML = `
        <div class="border p-4 rounded-md">
          <h2 class="text-lg font-semibold">Your Waste Footprint: ${(totalWeight / 1000).toFixed(2)} kg/week</h2>
          <p>That's approximately ${(totalWeight * 52 / 1000).toFixed(1)} kg per year!</p>
          <p><strong>Paper Waste Details:</strong></p>
          <ul class="list-disc pl-5">
            <li>Office Paper: ${(paperDetails.officePaper / 1000).toFixed(2)} kg</li>
            <li>Newspapers/Magazines: ${(paperDetails.magazines / 1000).toFixed(2)} kg</li>
            <li>Cardboard/Boxes: ${(paperDetails.cardboard / 1000).toFixed(2)} kg</li>
          </ul>
          <p><strong>Potential Recycling Income:</strong> $${earnings.toFixed(2)}/week ($${(earnings * 52).toFixed(2)}/year)</p>
          ${tips.length > 0 ? '<p><strong>Tips to Reduce:</strong></p><ul class="list-disc pl-5">' + tips.map(tip => `<li>${tip}</li>`).join('') + '</ul>' : ''}
        </div>
      `;

      if (wasteChart) wasteChart.destroy();
      const ctx = document.getElementById('wasteChart').getContext('2d');
      wasteChart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: ['Plastic', 'Paper', 'Glass', 'Metal'],
          datasets: [{
            label: 'Waste Weight (g)',
            data: [plasticWeight, paperWeight, glassWeight, metalWeight],
            backgroundColor: ['#34D399', '#FBBF24', '#60A5FA', '#A78BFA']
          }]
        },
        options: {
          scales: {
            y: { beginAtZero: true, title: { display: true, text: 'Weight (g)' } }
          }
        }
      });
    });
  </script>
</body>
</html>
